{% extends 'base.html' %}
{% block content %}
<h3>Attendance Records</h3>
<a href="{% url 'attendance_add' %}" class="btn btn-primary mb-3">Add Attendance</a>
<table class="table table-bordered">
    <tr>
        <th>Student</th>
        <th>Date</th>
        <th>Status</th>
    </tr>
    {% for record in attendance %}
    <tr>
        <td>{{ record.student.name }}</td>
        <td>{{ record.date }}</td>
        <td>{{ record.get_status_display }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
