{% extends 'base.html' %}
{% block content %}
<h3>Student List</h3>
<a href="{% url 'student_add' %}" class="btn btn-primary mb-3">Add Student</a>
<table class="table table-bordered">
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Course</th>
        <th>Phone</th>
        <th>Action</th>
    </tr>
    {% for student in students %}
    <tr>
        <td>{{ student.roll_no }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.course }}</td>
        <td>{{ student.phone }}</td>
        <td>
            <a href="{% url 'student_detail' student.pk %}" class="btn btn-info btn-sm">View</a>
            <a href="{% url 'student_edit' student.pk %}" class="btn btn-warning btn-sm">Edit</a>
            <a href="{% url 'student_delete' student.pk %}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
