{% extends 'base.html' %}
{% block content %}
<h3>Delete Student</h3>
<p>Are you sure you want to delete {{ student.name }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
